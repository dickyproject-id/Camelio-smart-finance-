name: smart_finance_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6+6

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Icons & Core Assets
  cupertino_icons: ^1.0.8 # Icon standar gaya iOS (Apple Design)
  font_awesome_flutter: ^11.0.0 # Koleksi icon tambahan (Social Media, Brand, dsb)

  # Backend & Cloud Services (Firebase)
  firebase_core: ^4.7.0 # Inisialisasi utama layanan Firebase
  firebase_auth: ^6.4.0 # Manajemen autentikasi (Login, Register, Social Sign-In)
  cloud_firestore: ^6.3.0 # Database NoSQL real-time untuk menyimpan data transaksi & user
  firebase_remote_config: ^6.3.0 # Konfigurasi dinamis untuk update API Key/Fitur tanpa update aplikasi

  # AI, OCR & Network
  google_generative_ai: any # Integrasi model Google Gemini 1.5 Flash untuk analisis keuangan
  http: ^1.6.0 # Protokol komunikasi data untuk memanggil API eksternal
  googleapis: ^16.0.0 # Akses ke ekosistem layanan Google API
  googleapis_auth: ^1.1.0 # Protokol OAuth 2.0 untuk otorisasi layanan Google
  flutter_dotenv: ^6.0.1 # Manajemen variabel lingkungan (.env) untuk keamanan API Key

  # User Interface & Experience (Aesthetics)
  # Graphics & Visualization
  fl_chart: ^1.2.0 # Library visualisasi data (Grafik Pie, Bar, & Line) interaktif

  # Assets & Localization
  google_fonts: ^8.0.2 # Integrasi font Google (Outfit) untuk tipografi yang premium
  intl: ^0.20.2 # Internasionalisasi: Format mata uang IDR, tanggal, dan angka
  image_picker: ^1.2.1 # Akses ke galeri foto dan kamera perangkat

  # Design Aesthetics
  glassmorphism: ^3.0.0 # Implementasi desain Glassmorphism (efek kaca transparan)
  crystal_navigation_bar: ^1.1.0 # Komponen Bottom Navbar estetik bergaya floating-glass

  # Image & Capturing
  screenshot: ^3.0.0 # Menangkap widget menjadi gambar (mendukung Long Screenshot & PDF export)
  path_provider: ^2.1.5 # Akses ke direktori sistem untuk penyimpanan file sementara
  share_plus: ^12.0.2 # Membagikan hasil (Gambar/PDF) ke aplikasi pihak ketiga (WhatsApp, dsb)

  # PDF & Document Generation
  pdf: ^3.12.0 # Library utama untuk membuat dokumen PDF secara programatik
  printing: ^5.14.3 # Layanan cetak dan pratinjau PDF serta integrasi download file

  # State Management & Service Locator
  provider: ^6.1.5+1 # Manajemen state reaktif untuk sinkronisasi UI dan Data
  get_it: ^9.2.1 # Service Locator untuk manajemen dependensi objek agar memori efisien

  # Authentication & System Integration
  google_sign_in: ^6.2.1 # Layanan Login cepat menggunakan Akun Google
  sign_in_with_apple: ^7.0.1 # Layanan Login cepat menggunakan Apple ID
  extension_google_sign_in_as_googleapis_auth: ^2.0.13 # Bridge integrasi Google Sign-In dengan Google APIs
  shared_preferences: ^2.5.5 # Penyimpanan data lokal sederhana (Tema, Preferensi User)
  speech_to_text: ^7.0.0 # Konversi suara ke teks untuk fitur input transaksi suara (Voice AI)
  permission_handler: any # Manajemen izin akses perangkat (Kamera, Mic, Storage)
  flutter_local_notifications: ^18.0.1 # Notifikasi sistem (Tray/Layar Atas)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo_app_camelio.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env
    - assets/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
